name: 'Release image'

# Release button for a container image that repackages upstream software. Works out the
# tag from the upstream version in the repository: the version itself, or <version>-N
# when that version was released before (a rebuild, e.g. for a new base image). Builds
# and pushes the image with that tag and latest, then creates the tag and GitHub release.
#
# The image is built here, not by the repository's tag-triggered build: tags created
# with the workflow token don't trigger other workflows.

on:
  workflow_call:
    inputs:
      version_command:
        description: 'Shell command, run in the repository root, that prints the upstream version in the tag format, e.g. 26.8.3'
        type: string
        required: true
      tag:
        description: 'Release this tag instead of the one worked out from version_command'
        type: string
        default: ''
      prune_images:
        description: 'Prune old images after pushing?'
        type: boolean
        default: true
      dry_run:
        description: 'Work out the tag and build the image, but push nothing and create no release'
        type: boolean
        default: false
    outputs:
      tag:
        description: 'The tag that was released'
        value: '${{ jobs.tag.outputs.tag }}'

jobs:
  tag:
    name: 'Work out the tag'
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 5
    permissions:
      contents: 'read'
    outputs:
      tag: '${{ steps.tag.outputs.tag }}'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Work out the tag'
        id: 'tag'
        env:
          VERSION_COMMAND: '${{ inputs.version_command }}'
          OVERRIDE: '${{ inputs.tag }}'
          DEFAULT_BRANCH: '${{ github.event.repository.default_branch }}'
          DRY_RUN: '${{ inputs.dry_run }}'
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::Releases are cut from ${DEFAULT_BRANCH}, not ${GITHUB_REF#refs/heads/}"
            exit 1
          fi

          tags="$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||')"
          if [ -n "${OVERRIDE}" ]; then
            tag="${OVERRIDE}"
          else
            version="$(eval "${VERSION_COMMAND}")"
            if [ -z "${version}" ]; then
              echo "::error::version_command printed nothing: ${VERSION_COMMAND}"
              exit 1
            fi
            tag="${version}"
            n=1
            while grep -qxF "${tag}" <<< "${tags}"; do
              tag="${version}-${n}"
              n=$((n + 1))
            done
          fi
          if grep -qxF "${tag}" <<< "${tags}"; then
            echo "::error::Tag ${tag} already exists"
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          if [ "${DRY_RUN}" = 'true' ]; then
            echo "Dry run: would release **${tag}** from ${GITHUB_SHA::7}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Releasing **${tag}** from ${GITHUB_SHA::7}" >> "${GITHUB_STEP_SUMMARY}"
          fi

  build:
    name: 'Build'
    needs: 'tag'
    uses: 'trexx/actions/.github/workflows/build.yml@main'
    permissions:
      contents: 'read'
      packages: 'write'
    with:
      tags: |
        type=raw,value=${{ needs.tag.outputs.tag }}
        type=raw,value=latest
      flavor: 'latest=false'
      push: ${{ !inputs.dry_run }}
      prune_images: ${{ inputs.prune_images }}

  release:
    name: 'Create the release'
    needs: [ 'tag', 'build' ]
    if: '${{ !inputs.dry_run }}'
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 5
    permissions:
      contents: 'write'
    steps:
      - name: 'Create tag and release'
        env:
          GH_TOKEN: '${{ github.token }}'
          TAG: '${{ needs.tag.outputs.tag }}'
        run: 'gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "${TAG}" --notes ""'
