name: 'Trivy'

on:
  workflow_call:
    inputs:
      image:
        description: 'Image to scan (default ghcr.io/<repo>:latest)'
        type: string
        default: ''
      category:
        description: 'Code scanning category'
        type: string
        default: ''
      sbom:
        description: 'Submit the SBOM to the Dependency Graph'
        type: boolean
        default: true

jobs:
  scan:
    permissions:
      packages: 'read'
      contents: 'read' # for actions/checkout to fetch code
      security-events: 'write' # for github/codeql-action/upload-sarif to upload SARIF results
      actions: 'read' # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: 'scan'
    runs-on: 'ubuntu-26.04'
    steps:
      - name: 'Run Trivy in GitHub SBOM mode and submit results to Dependency Graph'
        if: ${{ inputs.sbom }}
        uses: 'aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25' # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: 'public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db'
          TRIVY_JAVA_DB_REPOSITORY: 'public.ecr.aws/aquasecurity/trivy-java-db,ghcr.io/aquasecurity/trivy-java-db'
        with:
          image-ref: "${{ inputs.image || format('ghcr.io/{0}:latest', github.repository) }}"
          format: 'github'
          output: 'dependency-results.sbom.json'
          github-pat: '${{ secrets.GITHUB_TOKEN }}'

      - name: 'Run Trivy vulnerability scanner'
        uses: 'aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25' # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: 'public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db'
          TRIVY_JAVA_DB_REPOSITORY: 'public.ecr.aws/aquasecurity/trivy-java-db,ghcr.io/aquasecurity/trivy-java-db'
        with:
          image-ref: "${{ inputs.image || format('ghcr.io/{0}:latest', github.repository) }}"
          format: 'sarif'
          output: 'trivy-results.sarif'
          scanners: 'vuln'

      - name: 'Upload Trivy scan results to GitHub Security tab'
        uses: 'github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934' # v4.39.5
        with:
          sarif_file: 'trivy-results.sarif'
          category: '${{ inputs.category }}'
