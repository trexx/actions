name: Build

on:
  workflow_call:
    inputs:
      prune_images:
        description: 'Prune old images?'
        type: boolean
        default: true
      context:
        description: 'Context to build'
        type: string
        default: "{{defaultContext}}"
      images:
        description: 'Images to build'
        type: string
        default: ghcr.io/${{ github.repository }}
      target:
        description: 'Dockerfile stage to build (default: the last one)'
        type: string
        default: ''
      tags:
        description: 'docker/metadata-action tag rules (default: its own rules)'
        type: string
        default: ''
      flavor:
        description: 'docker/metadata-action flavor (default: its own)'
        type: string
        default: ''
      labels:
        description: 'Extra image labels, one key=value per line'
        type: string
        default: ''
      platforms:
        description: 'Comma-separated platforms, e.g. linux/amd64,linux/arm64 (default: the runner''s)'
        type: string
        default: ''
      push:
        description: 'Push the image? With false the image is only built, e.g. on pull requests'
        type: boolean
        default: true
      cache_scope:
        description: 'GitHub Actions cache scope for build layers (default: no cache)'
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write

    steps:
      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login against a Docker registry
      # https://github.com/docker/login-action
      - name: Log into registry ghcr.io
        if: ${{ inputs.push }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.images }}
          tags: ${{ inputs.tags }}
          flavor: ${{ inputs.flavor }}
          labels: ${{ inputs.labels }}

      # Build and push Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: ${{ inputs.push }}
          context: ${{ inputs.context }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ inputs.cache_scope != '' && format('type=gha,scope={0}', inputs.cache_scope) || '' }}
          cache-to: ${{ inputs.cache_scope != '' && format('type=gha,scope={0},mode=max', inputs.cache_scope) || '' }}

      # Clearing old images
      - name: Registry pruning
        if: ${{ inputs.push && inputs.prune_images }}
        uses: 'trexx/actions/.github/actions/prune-ghcr@main'
